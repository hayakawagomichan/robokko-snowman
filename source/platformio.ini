; M5Stack ATOM Lite / ATOMS3 Lite + Grove接続サーボ
; 書き込み:
;   ATOM Lite   白版     pio run -e white  -t upload
;   ATOM Lite   オレンジ版 pio run -e orange -t upload
;   ATOMS3 Lite 白版     pio run -e s3-white  -t upload
;   ATOMS3 Lite オレンジ版 pio run -e s3-orange -t upload
[platformio]
default_envs = white

[env]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@1.2.1
    fastled/FastLED@3.7.0

; --- ATOM Lite (ESP32-PICO-D4) ---
[atom]
board = m5stack-atom
upload_speed = 1500000

[env:white]
extends = atom
build_flags = -DIDLE_COLOR=0xFFFFFF

[env:orange]
extends = atom
build_flags = -DIDLE_COLOR=0xFF3000

; --- ATOMS3 Lite (ESP32-S3) ---
[atoms3]
board = m5stack-atoms3
build_flags = -DATOMS3_LITE -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3-white]
extends = atoms3
build_flags = ${atoms3.build_flags} -DIDLE_COLOR=0xFFFFFF

[env:s3-orange]
extends = atoms3
build_flags = ${atoms3.build_flags} -DIDLE_COLOR=0xFF3000
